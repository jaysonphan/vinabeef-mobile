name: vinabeef_mobile
description: VinaBeef M2 - field health recording at the barn (RFID scan, durable offline draft, idempotent sync).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.1
  path: ^1.9.0
  dio: ^5.7.0
  uuid: ^4.5.1
  flutter_appauth: ">=7.0.0 <10.0.0"
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
